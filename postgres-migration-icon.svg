<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6FA8"/>
      <stop offset="1" stop-color="#2A4C77"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FD38A"/>
      <stop offset="1" stop-color="#37A96B"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Elephant, side profile (Postgres 'Slonik' inspired) -->
  <g fill="#EAF2FB">
    <!-- body + head + rear, single silhouette -->
    <path d="M150 300
             c0 -50 40 -92 92 -92
             c30 0 57 14 74 36
             c8 -3 17 -3 25 0
             c15 5 25 19 25 35
             c0 12 -6 23 -15 30
             c1 6 1 12 0 18
             l0 40
             c0 8 -6 14 -14 14
             l-14 0
             c-8 0 -14 -6 -14 -14
             l0 -18
             c-14 5 -29 8 -45 8
             c-9 0 -18 -1 -27 -3
             l0 27
             c0 8 -6 14 -14 14
             l-14 0
             c-8 0 -14 -6 -14 -14
             l0 -40
             c-20 -16 -30 -40 -30 -66
             z"/>
    <!-- ear -->
    <path d="M300 236
             c22 0 40 18 40 40
             c0 20 -14 36 -33 39
             c8 -12 12 -26 12 -41
             c0 -14 -7 -27 -19 -38
             z" fill="#D3E2F4"/>
    <!-- trunk curving down -->
    <path d="M232 244
             c-20 2 -34 18 -34 40
             c0 20 6 40 6 58
             c0 10 8 18 18 18
             c9 0 16 -7 16 -16
             c0 -18 -6 -36 -6 -54
             c0 -12 6 -22 16 -27
             c-6 -10 -13 -17 -22 -19
             z" fill="#EAF2FB"/>
  </g>
  <!-- eye -->
  <circle cx="286" cy="252" r="8" fill="#2A4C77"/>
  <!-- tusk -->
  <path d="M236 300 c-6 8 -6 18 -2 27 c-8 -6 -12 -18 -8 -28 z" fill="#ffffff"/>

  <!-- Migration arrow sweeping beneath the elephant -->
  <g>
    <path d="M140 402
             q130 60 236 -8"
          fill="none" stroke="url(#arrow)" stroke-width="24"
          stroke-linecap="round"/>
    <path d="M356 416 l34 -34 l2 50 z" fill="url(#arrow)"/>
  </g>

  <!-- source data cylinder (DB -> DB migration cue) -->
  <g transform="translate(140,388)">
    <ellipse cx="0" cy="0" rx="19" ry="7" fill="#EAF2FB"/>
    <rect x="-19" y="0" width="38" height="20" fill="#EAF2FB"/>
    <ellipse cx="0" cy="20" rx="19" ry="7" fill="#C9DAF0"/>
    <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#C9DAF0" stroke-width="2"/>
  </g>
</svg>
